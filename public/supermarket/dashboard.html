<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supermercado · Análise de Gastos</title>
    <style>
      :root {
        --bg: #0f1729;
        --panel: #16203a;
        --panel-2: #1d2947;
        --border: #263355;
        --text: #e8edf7;
        --muted: #93a1c0;
        --accent: #4f8cff;
        --good: #34d399;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
        --radius: 16px;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6fb;
          --panel: #ffffff;
          --panel-2: #f0f3fa;
          --border: #e2e8f2;
          --text: #16203a;
          --muted: #5b6785;
          --shadow: 0 6px 24px rgba(20, 32, 58, 0.08);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; }
      header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
      header.top h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
      header.top .emoji { font-size: 26px; }
      .config {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
      }
      .config label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
      .config input {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 9px 11px;
        border-radius: 10px;
        font-size: 14px;
      }
      .config .actions { display: flex; align-items: end; }
      button.load {
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button.load:hover { filter: brightness(1.06); }
      .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
      .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
      .kpi .k-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
      .kpi .k-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
      .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
      .card h2 { font-size: 15px; margin: 0 0 16px; letter-spacing: -0.01em; }
      .donut-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
      .legend { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 8px; }
      .legend .li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .legend .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
      .legend .li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .legend .li .val { color: var(--muted); font-variant-numeric: tabular-nums; }
      .bars { display: flex; flex-direction: column; gap: 10px; }
      .bar-row { display: grid; grid-template-columns: 66px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
      .bar-track { background: var(--panel-2); border-radius: 8px; height: 22px; overflow: hidden; }
      .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7db0ff); border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
      table th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 0 10px; }
      table td { padding: 9px 0; border-top: 1px solid var(--border); }
      table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .full { grid-column: 1 / -1; }
      .muted { color: var(--muted); }
      .cat-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
      .empty { text-align: center; color: var(--muted); padding: 40px 0; }
      .status { font-size: 13px; color: var(--muted); margin-left: auto; }
      .status.err { color: #f87171; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <span class="emoji">🛒</span>
        <h1>Supermercado · Análise de Gastos</h1>
        <span id="status" class="status"></span>
      </header>

      <section class="config">
        <div>
          <label for="server">Servidor</label>
          <input id="server" placeholder="https://sua-evolution-api" />
        </div>
        <div>
          <label for="instance">Instância</label>
          <input id="instance" placeholder="minha-instancia" />
        </div>
        <div>
          <label for="apikey">API Key</label>
          <input id="apikey" type="password" placeholder="apikey da instância" />
        </div>
        <div>
          <label for="start">De</label>
          <input id="start" type="date" />
        </div>
        <div>
          <label for="end">Até</label>
          <input id="end" type="date" />
        </div>
        <div class="actions">
          <button class="load" id="load">Carregar</button>
        </div>
      </section>

      <section class="kpis" id="kpis"></section>

      <div class="grid">
        <div class="card">
          <h2>Gastos por categoria</h2>
          <div id="byCategory"></div>
        </div>
        <div class="card">
          <h2>Evolução mensal</h2>
          <div id="byMonth"></div>
        </div>
        <div class="card">
          <h2>Onde você mais compra (lojas)</h2>
          <div id="topStores"></div>
        </div>
        <div class="card">
          <h2>Itens que mais pesam</h2>
          <div id="topItems"></div>
        </div>
      </div>
    </div>

    <script>
      // Categorical palette (aligned with the backend category list).
      var PALETTE = [
        '#4f8cff', '#34d399', '#f59e0b', '#ef4444', '#a78bfa',
        '#22d3ee', '#f472b6', '#84cc16', '#fb923c', '#2dd4bf',
        '#e879f9', '#60a5fa', '#facc15', '#fca5a5', '#94a3b8',
      ];
      var colorFor = {};
      function categoryColor(name, i) {
        if (!colorFor[name]) colorFor[name] = PALETTE[i % PALETTE.length];
        return colorFor[name];
      }
      var BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
      function money(v) { return BRL.format(Number(v) || 0); }
      function el(id) { return document.getElementById(id); }

      function setStatus(msg, isErr) {
        var s = el('status');
        s.textContent = msg || '';
        s.className = 'status' + (isErr ? ' err' : '');
      }

      // Persist connection settings locally so the user configures once.
      function saveCfg() {
        ['server', 'instance', 'apikey', 'start', 'end'].forEach(function (k) {
          localStorage.setItem('mkt_' + k, el(k).value);
        });
      }
      function loadCfg() {
        ['server', 'instance', 'apikey', 'start', 'end'].forEach(function (k) {
          var v = localStorage.getItem('mkt_' + k);
          if (v) el(k).value = v;
        });
        if (!el('server').value) el('server').value = location.origin;
      }

      function kpis(summary) {
        var items = [
          { label: 'Total gasto', value: money(summary.totalSpent) },
          { label: 'Notas', value: summary.receiptCount },
          { label: 'Ticket médio', value: money(summary.averageTicket) },
          { label: 'Itens', value: summary.itemCount },
          { label: 'Categoria top', value: summary.topCategory || '—' },
        ];
        el('kpis').innerHTML = items
          .map(function (i) {
            return '<div class="kpi"><div class="k-label">' + i.label + '</div><div class="k-value">' + i.value + '</div></div>';
          })
          .join('');
      }

      function donut(data) {
        var target = el('byCategory');
        if (!data.length) { target.innerHTML = '<div class="empty">Sem dados no período.</div>'; return; }
        var total = data.reduce(function (s, d) { return s + d.total; }, 0) || 1;
        var r = 70, c = 2 * Math.PI * r, offset = 0, size = 180;
        var arcs = data
          .map(function (d, i) {
            var frac = d.total / total;
            var len = frac * c;
            var seg =
              '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' +
              categoryColor(d.category, i) + '" stroke-width="26" stroke-dasharray="' + len + ' ' + (c - len) +
              '" stroke-dashoffset="' + -offset + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"></circle>';
            offset += len;
            return seg;
          })
          .join('');
        var svg =
          '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + arcs +
          '<text x="50%" y="47%" text-anchor="middle" fill="var(--muted)" font-size="11">Total</text>' +
          '<text x="50%" y="60%" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">' +
          money(total) + '</text></svg>';
        var legend = data
          .map(function (d, i) {
            return (
              '<div class="li"><span class="dot" style="background:' + categoryColor(d.category, i) + '"></span>' +
              '<span class="name">' + d.category + '</span>' +
              '<span class="val">' + money(d.total) + ' · ' + d.percentage + '%</span></div>'
            );
          })
          .join('');
        target.innerHTML = '<div class="donut-row"><div>' + svg + '</div><div class="legend">' + legend + '</div></div>';
      }

      function monthBars(data) {
        var target = el('byMonth');
        if (!data.length) { target.innerHTML = '<div class="empty">Sem dados no período.</div>'; return; }
        var max = Math.max.apply(null, data.map(function (d) { return d.total; })) || 1;
        var names = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        target.innerHTML =
          '<div class="bars">' +
          data
            .map(function (d) {
              var parts = d.month.split('-');
              var label = (names[Number(parts[1]) - 1] || parts[1]) + '/' + parts[0].slice(2);
              var w = Math.max(2, (d.total / max) * 100);
              return (
                '<div class="bar-row"><span class="muted">' + label + '</span>' +
                '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>' +
                '<span>' + money(d.total) + '</span></div>'
              );
            })
            .join('') +
          '</div>';
      }

      function storeTable(data) {
        var target = el('topStores');
        if (!data.length) { target.innerHTML = '<div class="empty">Sem dados no período.</div>'; return; }
        target.innerHTML =
          '<table><thead><tr><th>Loja</th><th class="num">Visitas</th><th class="num">Total</th></tr></thead><tbody>' +
          data
            .map(function (s) {
              return '<tr><td>' + s.store + '</td><td class="num">' + s.visits + '</td><td class="num">' + money(s.total) + '</td></tr>';
            })
            .join('') +
          '</tbody></table>';
      }

      function itemsTable(data) {
        var target = el('topItems');
        if (!data.length) { target.innerHTML = '<div class="empty">Sem dados no período.</div>'; return; }
        target.innerHTML =
          '<table><thead><tr><th>Item</th><th>Categoria</th><th class="num">Total</th></tr></thead><tbody>' +
          data
            .map(function (it, i) {
              var col = categoryColor(it.category, i);
              return (
                '<tr><td>' + it.description + '</td>' +
                '<td><span class="cat-tag" style="background:' + col + '22;color:' + col + '">' + it.category + '</span></td>' +
                '<td class="num">' + money(it.total) + '</td></tr>'
              );
            })
            .join('') +
          '</tbody></table>';
      }

      async function loadData() {
        var server = el('server').value.replace(/\/$/, '');
        var instance = el('instance').value.trim();
        var apikey = el('apikey').value.trim();
        if (!server || !instance || !apikey) { setStatus('Preencha servidor, instância e API key.', true); return; }
        saveCfg();
        setStatus('Carregando…');

        var qs = [];
        if (el('start').value) qs.push('startDate=' + el('start').value);
        if (el('end').value) qs.push('endDate=' + el('end').value);
        var url = server + '/supermarket/analytics/' + encodeURIComponent(instance) + (qs.length ? '?' + qs.join('&') : '');

        try {
          var resp = await fetch(url, { headers: { apikey: apikey } });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          var data = await resp.json();
          kpis(data.summary || {});
          donut(data.byCategory || []);
          monthBars(data.byMonth || []);
          storeTable(data.topStores || []);
          itemsTable(data.topItems || []);
          setStatus('Atualizado.');
        } catch (e) {
          setStatus('Falha ao carregar: ' + e.message + ' (verifique servidor/instância/API key).', true);
        }
      }

      el('load').addEventListener('click', loadData);
      loadCfg();
      if (el('instance').value && el('apikey').value) loadData();
    </script>
  </body>
</html>
